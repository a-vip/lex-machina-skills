name: "Validate Skills, Claude Plugin, Hooks & Citation Verifier"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate agentskills.io Spec, Claude Plugin & Verifier Hook
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate JSON manifests, agentskills.io frontmatter & deterministic verifier
        run: |
          python - << 'EOF'
          import json
          import re
          import subprocess
          import sys
          from pathlib import Path

          # 1. Validate all JSON files
          for jf in [
              "marketplace.json",
              ".claude-plugin/plugin.json",
              ".claude-plugin/marketplace.json",
              ".mcp.json",
              "hooks/hooks.json",
              "claude/claude_desktop_config.json",
          ]:
              p = Path(jf)
              assert p.exists(), f"Missing required manifest: {jf}"
              json.loads(p.read_text(encoding="utf-8"))
              print(f"OK JSON: {jf}")

          # 2. Validate all 6 skills against agentskills.io frontmatter spec
          manifest = json.loads(Path("marketplace.json").read_text(encoding="utf-8"))
          assert len(manifest["skills"]) == 6, f"Expected 6 skills, got {len(manifest['skills'])}"
          for s in manifest["skills"]:
              ep = Path(s["entrypoint"])
              assert ep.exists(), f"Missing skill entrypoint: {ep}"
              content = ep.read_text(encoding="utf-8")
              assert content.startswith("---\n"), f"{ep} missing YAML frontmatter"
              fm = content.split("---\n", 2)[1]
              assert re.search(r"^name:\s+[a-z0-9-]+$", fm, re.M), f"{ep} invalid agentskills.io name"
              assert re.search(r"^description:\s+.{40,}", fm, re.M), f"{ep} missing rich description"
              assert "Do NOT use" in fm, f"{ep} missing negative trigger boundary"
              assert len(content.splitlines()) < 500, f"{ep} exceeds 500-line progressive disclosure budget"
              print(f"OK Skill (agentskills.io): {s['id']} ({len(content.splitlines())} lines)")

          # 3. Smoke-test deterministic ABA Opinion 512 citation verifier script
          good = subprocess.run(
              [sys.executable, "scripts/verify_memo_citations.py"],
              input="Under EU AI Act Article 5, CRA Article 14, and Additional Protocol II Article 13, obligations apply. EO 14110 was revoked on 2025-01-20. Brazil PL 2338/2023 remains pending Chamber review.",
              text=True, capture_output=True,
          )
          assert good.returncode == 0, f"Valid memo failed verifier: {good.stdout} {good.stderr}"

          bad = subprocess.run(
              [sys.executable, "scripts/verify_memo_citations.py"],
              input="Under EU AI Act Article 199, Additional Protocol II Article 99, and active Executive Order 14110, Brazil PL 2338/2023 is currently enacted and in force.",
              text=True, capture_output=True,
          )
          assert bad.returncode == 1, f"Fabricated memo should fail verifier! stdout={bad.stdout}"
          print("OK Deterministic verifier passed positive & adversarial v3.0 checks!")
          EOF
